<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scientific Calculator</title>
<style>
:root{
  --bg:#ffffff; --ink:#0f2744; --muted:#5b7089; --line:#d6e4f5; --line2:#b9d2ee;
  --b50:#f5f9ff; --b100:#e8f2ff; --b200:#d0e3fc; --b300:#a9cdf8; --b400:#7ab0f2;
  --b600:#1565e6; --b700:#0b4fbd; --b800:#093d94; --err:#b3372a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;-webkit-tap-highlight-color:transparent}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:18px;color:var(--b700);display:flex;align-items:center;gap:10px}
.logo{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--b600);color:#fff;font-size:18px}
.tabs{display:flex;gap:6px;margin-left:auto}
.tabs button{border:1px solid var(--line2);background:var(--b100);color:var(--b700);border-radius:10px;padding:8px 18px;font-weight:600;cursor:pointer}
.tabs button:hover{background:var(--b200)}
.tabs button.active{background:var(--b600);border-color:var(--b600);color:#fff}
main{max-width:1320px;margin:0 auto;padding:18px 20px 40px}
.panel{display:none}.panel.active{display:block}
.card{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
.card h3{margin:0 0 10px;font-size:16px;color:var(--b800)}
.card h4{margin:14px 0 6px;font-size:14px;color:var(--b800)}
.muted{color:var(--muted)}.small{font-size:13px}.mono{font-family:var(--mono)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 140px;min-width:0}
label.lab{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px;font-weight:600}
input[type=text],select,textarea{width:100%;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font:inherit;color:var(--ink);background:#fff;outline:none}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--b600);box-shadow:0 0 0 3px rgba(21,101,230,.14)}
textarea{resize:vertical;font-family:var(--mono);font-size:14px}
.btn{border:1px solid var(--line2);background:var(--b100);color:var(--b700);border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;outline:none}
.btn:hover{background:var(--b200)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--b600);border-color:var(--b600);color:#fff}.btn.primary:hover{background:var(--b700)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.mid{background:var(--b200);border-color:var(--b300)}
.btn:focus-visible,.key:focus-visible{box-shadow:0 0 0 3px rgba(21,101,230,.3)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--b700);padding:5px 12px;font-weight:600;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--b600);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chips button{flex:none;border:1px solid var(--line2);background:#fff;color:var(--b700);border-radius:999px;padding:6px 13px;font-weight:600;cursor:pointer;font-size:13.5px}
.chips button:hover{background:var(--b100)}.chips button.on{background:var(--b600);border-color:var(--b600);color:#fff}
.err{color:var(--err);font-weight:600}
.ok{color:var(--b700)}

/* ---------- Normal ---------- */
.normal-grid{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:18px;align-items:start}
.display{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:var(--b50);margin-bottom:12px}
#expr{border:0;background:transparent;box-shadow:none!important;font-family:var(--mono);font-size:21px;text-align:right;padding:4px 2px}
#result{min-height:38px;font-family:var(--mono);font-size:27px;text-align:right;color:var(--b700);word-break:break-all;font-weight:600}
#resultExtra{text-align:right;font-size:13.5px;color:var(--muted);min-height:18px;font-family:var(--mono);word-break:break-all}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.key{height:46px;border-radius:10px;border:1px solid transparent;font-size:16px;font-weight:600;cursor:pointer;outline:none;user-select:none;padding:0}
.key:active{transform:translateY(1px)}
.k-num{background:#f0f7ff;border-color:#d3e4fb;color:#0a3b78}.k-num:hover{background:#e1eeff}
.k-fn{background:#d9e9fe;border-color:#c0d9fa;color:#0b4a9e;font-size:14.5px}.k-fn:hover{background:#c8def9}
.k-op{background:#b3d2fa;border-color:#9bc2f5;color:#083f8c}.k-op:hover{background:#9fc6f7}
.k-ctl{background:#8fbcf3;border-color:#7aaeee;color:#062f6e}.k-ctl:hover{background:#7aaeee}
.k-eq{background:#1565e6;border-color:#1565e6;color:#fff;font-size:22px;grid-row:span 2;height:auto}.k-eq:hover{background:#0b4fbd}
.history{margin-top:14px;max-height:190px;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
.history div{padding:4px 6px;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:13px;display:flex;justify-content:space-between;gap:10px}
.history div:hover{background:var(--b100)}
.history .hr{color:var(--b700);font-weight:600}
details.steps{margin-top:8px;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff}
details.steps summary{cursor:pointer;color:var(--b700);font-weight:600}
details.steps ol,details.steps ul{margin:6px 0 4px;padding-left:20px}
details.steps li{margin:2px 0}
.out{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--b50);min-height:44px}
.out:empty{display:none}
.out .rl{display:flex;gap:10px;flex-wrap:wrap;margin:3px 0;align-items:baseline}
.out .rl .k{color:var(--muted);min-width:110px;font-size:13px}
.out .rl .v{font-family:var(--mono);font-weight:600;color:var(--ink);word-break:break-word}
.out .big{font-family:var(--mono);font-size:18px;color:var(--b700);font-weight:700}
.out ol,.out ul{margin:4px 0;padding-left:20px;font-size:13.5px}
.out table{border-collapse:collapse;font-size:13px;margin-top:6px}
.out th,.out td{border:1px solid var(--line);padding:3px 9px;text-align:right;font-family:var(--mono)}
.out th{background:var(--b100);color:var(--b800)}
.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sub{border-top:1px dashed var(--line2);margin-top:14px;padding-top:6px}

/* ---------- Graph ---------- */
.graph-grid{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
.canvas-wrap{position:relative;border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:#fff}
#gcanvas{display:block;width:100%;height:560px;touch-action:none;cursor:grab;background:#fff}
#gcanvas.dragging{cursor:grabbing}
.gtools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.gtools button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line2);background:rgba(255,255,255,.94);color:var(--b700);font-size:18px;font-weight:700;cursor:pointer;padding:0}
.gtools button:hover{background:var(--b100)}
.readout{font-family:var(--mono);font-size:13px;color:var(--muted);padding:6px 4px;min-height:28px}
.fnrow{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.fnrow input[type=color]{width:32px;height:32px;padding:0;border:1px solid var(--line2);border-radius:8px;background:#fff;cursor:pointer;flex:none}
.fnrow input[type=checkbox]{width:17px;height:17px;flex:none;accent-color:var(--b600)}
.fnrow .x{flex:none;width:30px;height:32px;border:1px solid var(--line2);background:#fff;border-radius:8px;color:var(--muted);cursor:pointer;font-size:16px}
.fnrow .x:hover{background:var(--b100);color:var(--b700)}
.fnerr{color:var(--err);font-size:12.5px;margin:0 0 6px 38px}

/* ---------- Matrix ---------- */
.mx-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.mgrid{display:grid;gap:6px;margin:10px 0;overflow-x:auto;padding:2px}
.mgrid input{width:100%;min-width:58px;text-align:center;font-family:var(--mono);padding:7px 4px}
.opgroup{margin:6px 0 2px}
.opgroup .gl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 5px}
.opgroup .row{gap:6px}
.opbtn{border:1px solid var(--b300);background:var(--b200);color:var(--b800);border-radius:9px;padding:8px 13px;font-weight:600;cursor:pointer;outline:none}
.opbtn:hover{background:var(--b300)}
.opbtn.two{background:#c3dbfb}
.opbtn.eqb{background:var(--b600);color:#fff;border-color:var(--b600)}
.mresult{margin-top:16px}
.mblocks{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start;margin:8px 0}
.mblock .ml{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:3px}
.mx{display:inline-grid;gap:3px 16px;padding:6px 12px;border-left:2px solid var(--b600);border-right:2px solid var(--b600);border-radius:8px;background:#fff}
.mx span{text-align:right;font-family:var(--mono);font-size:14px;white-space:nowrap}
.stepbox{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
.step{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0}
.step .sd{min-width:190px;font-family:var(--mono);font-size:13px;color:var(--b800)}
.tline{font-family:var(--mono);font-size:14px;margin:3px 0}

@media (max-width:980px){
  .normal-grid,.graph-grid{grid-template-columns:1fr}
  .graph-grid .canvas-col{order:-1}
  #gcanvas{height:420px}
  .tabs{margin-left:0;width:100%}.tabs button{flex:1}
}
@media (max-width:520px){
  main{padding:12px 10px 30px}.top{padding:10px 12px}
  .key{height:42px;font-size:15px}.k-fn{font-size:13px}
  #expr{font-size:18px}#result{font-size:22px}
  .mgrid input{min-width:46px;padding:6px 2px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">∑</span><span>Scientific Calculator</span></div>
  <nav class="tabs" role="tablist" id="mainTabs">
    <button role="tab" data-tab="normal" class="active">Normal</button>
    <button role="tab" data-tab="graph">Graph</button>
    <button role="tab" data-tab="matrix">Matrix</button>
  </nav>
</header>
<main>
  <section id="panel-normal" class="panel active"></section>
  <section id="panel-graph" class="panel"></section>
  <section id="panel-matrix" class="panel"></section>
</main>
<script>
