<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>KNN Visualizer</title>
<style>
:root{
  --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --line2:#d1d5db; --soft:#f9fafb;
  --accent:#2563eb; --warn:#c2410c; --grid:#eceff3; --axis:#cfd4dc;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:420px minmax(0,1fr);gap:14px;height:100vh;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px}
.left{display:flex;flex-direction:column;gap:11px;padding:14px;min-height:0}
.right{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
h1{font-size:18px;margin:0}
.sub{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.lbl,.field>span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.note{font-size:12px;color:var(--muted);margin:5px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button,select,input{font:inherit;color:var(--ink)}
button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;transition:background .12s,border-color .12s}
button:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover:not(:disabled){background:#1d4ed8}
input[type=number],select{width:100%;border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 8px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 26px;background:#fff;font-weight:600}
.seg button.on{background:var(--ink);color:#fff}
.table-wrap{flex:1;min-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{position:sticky;top:0;background:#fff;z-index:1;text-align:left;font-size:11.5px;color:var(--muted);padding:7px 5px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
thead th b{color:var(--ink)}
.c-idx{width:52px}.c-lab{width:104px}.c-del{width:30px}
tbody td{padding:3px 3px;border-bottom:1px solid var(--line)}
tbody tr:hover{background:var(--soft)}
td.idx{color:var(--muted);font-size:12px;white-space:nowrap;padding-left:7px}
td input,td select{padding:4px 5px;border-radius:6px;min-width:0;font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:#999;vertical-align:middle}
.del{padding:1px 7px;border-radius:6px;color:var(--muted);line-height:1.2;border-color:transparent}
.toolbar{padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
.kbox{display:flex;align-items:center;gap:8px}
.kbox input[type=number]{width:64px}
.kbox input[type=range]{width:130px;accent-color:var(--accent)}
.hintk{font-size:12px;color:var(--muted)}
.hintk.warn{color:var(--warn);font-weight:600}
.toolbar select{width:auto;min-width:130px}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;align-items:center}
.checks label{display:flex;align-items:center;gap:5px;cursor:pointer}
.checks input{accent-color:var(--accent)}
.checks label.off{opacity:.45}
.only3{display:none}
.is3 .only3{display:inline-block}
.is3 .only2{display:none}
.axz{display:none}
.is3 .axz{display:block}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{flex:1;min-width:130px;padding:9px 14px}
.stat small{display:block;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat b{font-size:17px;font-variant-numeric:tabular-nums}
.plot{position:relative;flex:1;min-height:380px;overflow:hidden}
.plot canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hint{position:absolute;left:12px;top:10px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:4px 9px;pointer-events:none}
.tip{position:absolute;left:0;top:0;display:none;pointer-events:none;z-index:5;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:8px 11px;box-shadow:0 6px 22px rgba(0,0,0,.14);font-size:12.5px;line-height:1.5;white-space:nowrap}
.tip .th{display:flex;align-items:center;gap:7px;margin-bottom:2px;font-size:13px}
.tip .th .dot{margin:0}
.tip .m{color:var(--muted)}
.bottom{padding:10px 14px;display:flex;flex-direction:column;gap:9px;height:236px;flex:none;overflow:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 8px;font-size:12.5px;background:#fff}
.chip b{font-weight:600;color:var(--muted)}
button.chip{cursor:pointer;padding:2px 6px 2px 8px}
button.chip.on{border-color:var(--ink);background:var(--soft)}
button.chip .x{color:var(--muted);padding:0 3px;border-radius:4px}
button.chip .x:hover{background:var(--line);color:var(--ink)}
.dia{display:inline-block;width:9px;height:9px;transform:rotate(45deg);border:1.5px solid var(--ink);margin:0 2px}
.ramp{display:inline-block;width:160px;height:10px;border-radius:5px;border:1px solid var(--line2);vertical-align:middle}
.readout{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px}
.readout .val{font-variant-numeric:tabular-nums}
.readout button,.qrow button.sm{padding:3px 10px;font-size:12px}
.qrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.nbwrap{border:1px solid var(--line);border-radius:8px;overflow:auto}
table.nb{table-layout:auto;font-size:12.5px;font-variant-numeric:tabular-nums}
table.nb th{position:static;background:var(--soft);padding:5px 10px;font-size:11.5px}
table.nb td{padding:4px 10px}
.nbhead{font-size:13px}
@media (max-width:900px){
  .app{grid-template-columns:1fr;height:auto}
  .table-wrap{max-height:340px;flex:none}
  .plot{min-height:460px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="left card">
    <div>
      <h1>KNN Visualizer</h1>
      <p class="sub">k-Nearest Neighbors for classification and regression.</p>
    </div>

    <div>
      <span class="lbl">Dataset</span>
      <select id="dsSel">
        <option value="breast">Breast Cancer (binary)</option>
        <option value="heart">Heart Disease (binary)</option>
        <option value="iris" selected>Iris (multi-class)</option>
        <option value="xor">XOR (binary)</option>
        <option value="house">House Prices (regression)</option>
      </select>
      <p class="note" id="dsNote"></p>
    </div>

    <div class="grid2">
      <div>
        <span class="lbl">Visualization</span>
        <div class="seg" id="dimSeg"><button data-dim="2" class="on">2D</button><button data-dim="3">3D</button></div>
      </div>
      <label class="field"><span>Number of records <em id="colHint" style="font-weight:400"></em></span>
        <input type="number" id="nInput" min="2" max="600" value="100"></label>
    </div>

    <div>
      <span class="lbl">Axes (features used for plot and distance)</span>
      <div class="grid3">
        <label><select id="axX" aria-label="X feature"></select></label>
        <label><select id="axY" aria-label="Y feature"></select></label>
        <label class="axz"><select id="axZ" aria-label="Z feature"></select></label>
      </div>
    </div>

    <div class="btns">
      <button id="applyN">Apply count</button>
      <button id="randBtn" class="primary">Randomize data</button>
      <button id="addBtn">+ Add record</button>
    </div>

    <div class="table-wrap">
      <table id="tbl">
        <thead id="th"></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </aside>

  <main class="right">
    <section class="toolbar card">
      <div>
        <span class="lbl">Neighbors (K)</span>
        <div class="kbox">
          <input type="number" id="kInput" min="1" max="32" value="3">
          <input type="range" id="kRange" min="1" max="32" value="3" aria-label="K">
          <span class="hintk" id="kHint"></span>
        </div>
      </div>
      <label class="field"><span>Distance</span>
        <select id="metricSel"><option value="euclid">Euclidean</option><option value="manhattan">Manhattan</option></select></label>
      <label class="field"><span>Voting</span>
        <select id="weightSel"><option value="uniform">Uniform</option><option value="distance">Weighted by 1/distance</option></select></label>
      <div class="btns">
        <button id="addQ" class="primary">+ Random query point</button>
        <button id="clrQ">Clear queries</button>
      </div>
      <div class="checks">
        <label title="Rescale every used feature to 0-1 before measuring distance"><input type="checkbox" id="optNorm" checked>Normalize features</label>
        <label id="lblReg" class="only2"><input type="checkbox" id="optReg" checked>Decision regions</label>
        <label id="lblRad" class="only2"><input type="checkbox" id="optRad" checked>Neighbor radius</label>
        <label id="lblPlace" class="only2"><input type="checkbox" id="optPlace">Click plot to place query</label>
        <label><input type="checkbox" id="optEqual">Equal axis scale</label>
        <button id="viewBtn" class="only3">Reset view</button>
      </div>
    </section>

    <section class="stats">
      <div class="stat card"><small>Samples</small><b id="stN">0</b></div>
      <div class="stat card"><small id="stLooL">Leave-one-out accuracy</small><b id="stLoo">-</b></div>
      <div class="stat card"><small>Query points</small><b id="stQ">0</b></div>
      <div class="stat card" style="flex:1.4"><small>Task</small><b id="stTask" style="font-size:14px"></b></div>
    </section>

    <section class="plot card" id="plot">
      <canvas id="cv"></canvas>
      <div class="hint" id="hint"></div>
      <div class="tip" id="tip"></div>
    </section>

    <section class="bottom card">
      <div class="legend" id="legend"></div>
      <div class="readout" id="readout"></div>
      <div class="qrow" id="qrow"></div>
      <div id="nbBox"></div>
    </section>
  </main>
</div>

function setup2D(b) {
  const L = 58, R = 18, Tp = 44, B = 44, pw = W - L - R, ph = H - Tp - B;
  const rx = b.mx[0] - b.mn[0], ry = b.mx[1] - b.mn[1];
  let sx, sy; if (S.equal) sx = sy = Math.min(pw / rx, ph / ry); else { sx = pw / rx; sy = ph / ry; }
  const aw = rx * sx, ah = ry * sy, ox = L + (pw - aw) / 2, oy = Tp + (ph - ah) / 2;
  const X = v => ox + (v - b.mn[0]) * sx, Y = v => oy + ah - (v - b.mn[1]) * sy;
  const inv = (px, py) => [b.mn[0] + (px - ox) / sx, b.mn[1] + (oy + ah - py) / sy];
  if (S.regions) drawRegions(ox, oy, aw, ah, inv);
  const tx = niceTicks(b.mn[0], b.mx[0], aw / 70), ty = niceTicks(b.mn[1], b.mx[1], ah / 50);
  ctx.lineWidth = 1; ctx.strokeStyle = '#eceff3';
  tx.ticks.forEach(t => { const x = Math.round(X(t)) + .5; ctx.beginPath(); ctx.moveTo(x, oy); ctx.lineTo(x, oy + ah); ctx.stroke(); text(t.toFixed(tx.dec), x, oy + ah + 14); });
  ty.ticks.forEach(t => { const y = Math.round(Y(t)) + .5; ctx.beginPath(); ctx.moveTo(ox, y); ctx.lineTo(ox + aw, y); ctx.stroke(); text(t.toFixed(ty.dec), ox - 7, y, { align: 'right' }); });
  ctx.strokeStyle = '#cfd4dc'; ctx.strokeRect(ox + .5, oy + .5, aw, ah);
  text(fname(0), ox + aw / 2, oy + ah + 32, { font: '600 12px system-ui', color: INK });
  ctx.save(); ctx.translate(14, oy + ah / 2); ctx.rotate(-Math.PI / 2); text(fname(1), 0, 0, { font: '600 12px system-ui', color: INK }); ctx.restore();
  S.view = { inv, ox, oy, aw, ah };
  return { P: v => ({ x: X(v.x), y: Y(v.y), d: 0, s: 1 }), is3: false };
}
function setup3D(b) {
  const rg = [0, 1, 2].map(a => b.mx[a] - b.mn[a]), mid = [0, 1, 2].map(a => (b.mx[a] + b.mn[a]) / 2), maxR = Math.max(...rg);
  const h = rg.map(r => S.equal ? r / maxR : 1), k = [0, 1, 2].map(a => 2 * h[a] / rg[a]);
  const cx = W / 2, cy = H / 2 + 12, Sc = Math.min(W, H) * 0.27 * S.zoom;
  const cyw = Math.cos(S.yaw), syw = Math.sin(S.yaw), cp = Math.cos(S.pitch), sp = Math.sin(S.pitch);
  const proj = (nx, ny, nz) => {
    const x1 = nx * cyw + nz * syw, z1 = -nx * syw + nz * cyw, y2 = ny * cp - z1 * sp, z2 = ny * sp + z1 * cp, f = 4 / (4 - z2);
    return { x: cx + x1 * f * Sc, y: cy - y2 * f * Sc, d: z2, s: f };
  };
  const nrm = (v, a) => (v - mid[a]) * k[a];
  const P = v => proj(nrm(v.x, 0), nrm(v.y, 1), nrm(v.z, 2));
  const tk = [0, 1, 2].map(a => niceTicks(b.mn[a], b.mx[a], 5));
  ctx.lineWidth = 1; ctx.strokeStyle = '#eceff3';
  tk[0].ticks.forEach(t => line(proj(nrm(t, 0), -h[1], -h[2]), proj(nrm(t, 0), -h[1], h[2])));
  tk[2].ticks.forEach(t => line(proj(-h[0], -h[1], nrm(t, 2)), proj(h[0], -h[1], nrm(t, 2))));
  const cs = []; for (let i = 0; i < 8; i++) cs.push(proj((i & 1 ? 1 : -1) * h[0], (i & 2 ? 1 : -1) * h[1], (i & 4 ? 1 : -1) * h[2]));
  ctx.strokeStyle = '#9aa3b2'; ctx.globalAlpha = .5;
  for (let i = 0; i < 8; i++) for (const a of [1, 2, 4]) if (!(i & a)) line(cs[i], cs[i | a]);
  ctx.globalAlpha = 1;
  const O = [-h[0], -h[1], -h[2]];
  ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
  const ends = [proj(h[0], O[1], O[2]), proj(O[0], h[1], O[2]), proj(O[0], O[1], h[2])], o = proj(...O);
  ends.forEach(e => line(o, e));
  tk[0].ticks.forEach(t => { const q = proj(nrm(t, 0), O[1], O[2]); text(t.toFixed(tk[0].dec), q.x, q.y + 12, { halo: true }); });
  tk[1].ticks.forEach(t => { const q = proj(O[0], nrm(t, 1), O[2]); text(t.toFixed(tk[1].dec), q.x - 8, q.y, { align: 'right', halo: true }); });
  tk[2].ticks.forEach(t => { const q = proj(O[0], O[1], nrm(t, 2)); text(t.toFixed(tk[2].dec), q.x - 8, q.y + 8, { align: 'right', halo: true }); });
  [0, 1, 2].forEach(i => text(fname(i), ends[i].x + (ends[i].x - o.x) * .1, ends[i].y + (ends[i].y - o.y) * .1, { font: '700 12px system-ui', color: INK, halo: true }));
  ctx.lineWidth = 1;
  return { P, is3: true };
}

/* ---------------- scene ---------------- */
function drawScene(setup) {
  const P = setup.P, n = S.rows.length, hov = S.hover, act = queryById(S.active);
  const pp = S.rows.map(r => P(pv(r.f))), qp = S.queries.map(q => P(pv(q.f)));
  const base = n > 250 ? 4 : n > 150 ? 4.5 : 5.5;
  const rp = i => Math.max(3, base * pp[i].s), rq = j => Math.max(8, 11 * qp[j].s);
  const aIdx = act ? S.queries.indexOf(act) : -1;

  // neighbor radius (2D)
  if (act && S.radius && !setup.is3 && act.nb.ds.length) {
    const r = act.nb.ds[act.nb.ds.length - 1], toRaw = (u, k) => S.norm ? S.nmin[k] + u * S.nrng[k] : u, pts = [];
    if (S.metric === 'manhattan') { [[r, 0], [0, r], [-r, 0], [0, -r]].forEach(([dx, dy]) => pts.push([act.u[0] + dx, act.u[1] + dy])); }
    else for (let t = 0; t < 72; t++) pts.push([act.u[0] + r * Math.cos(t / 72 * TAU), act.u[1] + r * Math.sin(t / 72 * TAU)]);
    ctx.save(); ctx.beginPath();
    pts.forEach(([a, b], i) => { const p = P({ x: toRaw(a, 0), y: toRaw(b, 1), z: 0 }); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
    ctx.closePath(); ctx.fillStyle = 'rgba(37,99,235,.06)'; ctx.fill(); ctx.setLineDash([6, 4]); ctx.lineWidth = 1.4; ctx.strokeStyle = '#2563eb'; ctx.stroke(); ctx.restore();
  }
  // lines from active query to neighbors
  if (act) {
    ctx.save(); ctx.lineWidth = 1.5; ctx.setLineDash([5, 3]); ctx.strokeStyle = INK; ctx.globalAlpha = .75;
    act.nb.idx.forEach(i => line(qp[aIdx], pp[i])); ctx.restore();
  }
  // items, depth sorted
  const items = [];
  for (let i = 0; i < n; i++) items.push({ k: 'p', i, d: pp[i].d });
  for (let j = 0; j < S.queries.length; j++) items.push({ k: 'q', j, d: qp[j].d + .25 });
  items.sort((a, b) => a.d - b.d);
  const nbSet = act ? new Set(act.nb.idx) : null;
  for (const it of items) {
    if (it.k === 'p') {
      const q = pp[it.i], r = rp(it.i);
      ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, TAU); ctx.globalAlpha = nbSet && !nbSet.has(it.i) ? .45 : .9; ctx.fillStyle = colorOfY(S.rows[it.i].y); ctx.fill();
      ctx.globalAlpha = 1; ctx.lineWidth = 1.2; ctx.strokeStyle = '#fff'; ctx.stroke();
      hit.push({ k: 'p', i: it.i, x: q.x, y: q.y, r, d: it.d });
    } else {
      const qq = S.queries[it.j], q = qp[it.j], r = rq(it.j) + (hov && hov.k === 'q' && hov.id === qq.id ? 3 : 0);
      ctx.save(); ctx.beginPath();
      ctx.moveTo(q.x, q.y - r); ctx.lineTo(q.x + r * .8, q.y); ctx.lineTo(q.x, q.y + r); ctx.lineTo(q.x - r * .8, q.y); ctx.closePath();
      ctx.shadowColor = predColor(qq); ctx.shadowBlur = 12; ctx.fillStyle = predColor(qq); ctx.fill(); ctx.shadowBlur = 0;
      ctx.lineJoin = 'miter'; ctx.lineWidth = 3.5; ctx.strokeStyle = INK; ctx.stroke(); ctx.lineWidth = 1.2; ctx.strokeStyle = '#fff'; ctx.stroke(); ctx.restore();
      text('Q' + qq.id, q.x, q.y - r - 8, { font: '700 11px system-ui', color: INK, halo: true });
      hit.push({ k: 'q', id: qq.id, x: q.x, y: q.y, r: r * .9, d: it.d });
    }
  }
  // neighbor rings and distance labels
  if (act) {
    ctx.save(); ctx.lineWidth = 2; ctx.strokeStyle = INK;
    act.nb.idx.forEach(i => { ctx.beginPath(); ctx.arc(pp[i].x, pp[i].y, rp(i) + 3.5, 0, TAU); ctx.stroke(); });
    ctx.restore();
    if (S.K <= 12) act.nb.idx.forEach((i, r) => {
      const a = qp[aIdx], b = pp[i];
      if (Math.hypot(a.x - b.x, a.y - b.y) < 46) return; // too short to label; the table lists every distance
      text(fmt(act.nb.ds[r], 3), (a.x + b.x) / 2, (a.y + b.y) / 2 - 7, { font: '600 11px system-ui', color: INK, halo: true });
    });
  }
  const ring = (i, w, dash) => { const q = pp[i]; ctx.save(); ctx.lineWidth = w; ctx.strokeStyle = INK; if (dash) ctx.setLineDash(dash); ctx.beginPath(); ctx.arc(q.x, q.y, rp(i) + 4, 0, TAU); ctx.stroke(); ctx.restore(); };
  if (hov && hov.k === 'p') ring(hov.i, 2);
  if (S.tblHover >= 0 && S.tblHover < n) ring(S.tblHover, 2, [3, 3]);
  if (S.sel.length === 2) {
    const a = pp[S.sel[0]], b = pp[S.sel[1]];
    ctx.save(); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.setLineDash([7, 4]); line(a, b); ctx.restore();
    pill('d = ' + fmt(dist(S.U[S.sel[0]], S.U[S.sel[1]]), 3), (a.x + b.x) / 2, (a.y + b.y) / 2 - 14);
  }
  S.sel.forEach((i, q) => { ring(i, 2.5); text(q ? 'B' : 'A', pp[i].x, pp[i].y - rp(i) - 13, { font: '700 13px system-ui', color: INK, halo: true }); });
}

/* ---------------- interaction ---------------- */
function pick(mx, my) {
  let best = null, bs = Infinity;
  for (const h of hit) {
    const dd = Math.hypot(h.x - mx, h.y - my);
    if (dd > h.r + 3) continue;
    const sc = dd - (h.k === 'q' ? 8 : 0) - h.d * 5;
    if (sc < bs) { bs = sc; best = h; }
  }
  return best;
}
const sameHover = (a, b) => (!a && !b) || (a && b && a.k === b.k && (a.k === 'p' ? a.i === b.i : a.id === b.id));
function updateHover(mx, my) {
  S.mouse = { x: mx, y: my };
  const h = pick(mx, my), prev = S.hover;
  S.hover = h ? { k: h.k, i: h.i, id: h.id } : null;
  cv.style.cursor = h ? 'pointer' : (S.dim === 3 ? 'grab' : S.place ? 'crosshair' : 'default');
  showTip(S.hover);
  if (!sameHover(prev, S.hover)) sched();
}
function hideTip() { tip.style.display = 'none'; }
function showTip(h) {
  if (!h) { hideTip(); return; }
  const f = feats(); let html;
  if (h.k === 'p') {
    const r = S.rows[h.i]; if (!r) { hideTip(); return; }
    const act = queryById(S.active);
    let extra = '';
    if (act) { const rank = act.nb.idx.indexOf(h.i); extra = `<div>Distance to Q${act.id}: <b>${fmt(dist(S.U[h.i], act.u), 4)}</b> <span class="m">${rank >= 0 ? `(neighbor #${rank + 1})` : '(not a neighbor)'}</span></div>`; }
    html = `<div class="th"><i class="dot" style="background:${colorOfY(r.y)}"></i><b>Point #${h.i + 1}</b></div>` +
      S.ax.slice(0, S.dim).map(a => `<div><span class="m">${f[a]}:</span> ${fmt(r.f[a])}</div>`).join('') +
      `<div>${isReg() ? 'Price' : 'Class'}: <b>${labelOf(r.y)}</b></div>${extra}`;
  } else {
    const q = queryById(h.id); if (!q) { hideTip(); return; }
    const d = DS[S.ds];
    html = `<div class="th"><i class="dia" style="background:${predColor(q)}"></i><b>Query Q${q.id}</b></div>` +
      S.ax.slice(0, S.dim).map(a => `<div><span class="m">${f[a]}:</span> ${fmt(q.f[a])}</div>`).join('') +
      (isReg() ? `<div>Predicted price: <b>${money(q.pred.value)}</b></div>` : `<div>Predicted: <b>${d.classes[q.pred.cls]}</b></div><div class="m">${d.classes.map((c, i) => `${c} ${q.pred.cnt[i]}`).join(' · ')}</div>`) +
      `<div>Nearest neighbor: <b>${fmt(q.nb.ds[0], 4)}</b></div><div>K-th neighbor: <b>${fmt(q.nb.ds[q.nb.ds.length - 1], 4)}</b></div><div class="m">Click to ${S.active === q.id ? 'hide' : 'show'} neighbors</div>`;
  }
  tip.innerHTML = html; tip.style.display = 'block';
  const pad = 14, tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = S.mouse.x + pad, y = S.mouse.y + pad;
  if (x + tw > W - 4) x = S.mouse.x - tw - pad;
  if (y + th > H - 4) y = S.mouse.y - th - pad;
  tip.style.transform = `translate(${Math.max(4, x)}px,${Math.max(4, y)}px)`;
}
function onClick(mx, my) {
  const h = pick(mx, my);
  if (h && h.k === 'q') { S.active = S.active === h.id ? null : h.id; }
  else if (h) {
    const q = S.sel.indexOf(h.i);
    if (q >= 0) S.sel.splice(q, 1); else if (S.sel.length >= 2) S.sel = [h.i]; else S.sel.push(h.i);
  } else if (S.place && S.dim === 2 && S.view && mx >= S.view.ox && mx <= S.view.ox + S.view.aw && my >= S.view.oy && my <= S.view.oy + S.view.ah) {
    const [x, y] = S.view.inv(mx, my), n = feats().length, f = [];
    for (let a = 0; a < n; a++) f.push(r3(S.rows.reduce((s, r) => s + r.f[a], 0) / S.rows.length));
    f[S.ax[0]] = r3(x); f[S.ax[1]] = r3(y);
    addQuery(f); return;
  } else { S.sel = []; S.active = null; }
  updateUI(); sched();
}
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, moved: false }; });
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  S.mouseIn = true;
  if (drag) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 4) drag.moved = true;
    if (drag.moved && S.dim === 3) {
      S.yaw += (e.clientX - drag.lx) * 0.01; S.pitch = clamp(S.pitch + (e.clientY - drag.ly) * 0.01, -1.5, 1.5);
      drag.lx = e.clientX; drag.ly = e.clientY; S.hover = null; hideTip(); cv.style.cursor = 'grabbing'; sched(); return;
    }
    drag.lx = e.clientX; drag.ly = e.clientY;
  }
  updateHover(mx, my);
});
cv.addEventListener('pointerup', e => {
  const r = cv.getBoundingClientRect();
  if (drag && !drag.moved) { S.mouseIn = true; S.mouse = { x: e.clientX - r.left, y: e.clientY - r.top }; onClick(S.mouse.x, S.mouse.y); updateHover(S.mouse.x, S.mouse.y); }
  drag = null;
});
cv.addEventListener('pointerleave', () => { S.mouseIn = false; if (!drag) { S.hover = null; hideTip(); sched(); } });
cv.addEventListener('wheel', e => { if (S.dim === 3) { e.preventDefault(); S.zoom = clamp(S.zoom * Math.exp(-e.deltaY * 0.001), 0.4, 3); sched(); } }, { passive: false });

/* ---------------- boot ---------------- */
window.__knn = S; // handy for debugging in the console
Object.defineProperty(window, '__hit', { get: () => hit });
resize();
loadDataset('iris');
})();
</script>
